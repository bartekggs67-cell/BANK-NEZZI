<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Nezzi</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, Arial, sans-serif; }
    body { margin: 0; background: #0b1020; color: #f8fafc; padding: 20px; }
    .container { max-width: 820px; margin: 0 auto; }
    .card { background: #131b2e; border: 1px solid #24304b; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    h1, h2 { margin: 0 0 10px; }
    .muted { color: #94a3b8; font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    input { background: #0b1020; color: #fff; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    button { border: 0; border-radius: 10px; padding: 10px 15px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .blue { background: #38bdf8; color: #082f49; }
    .dark { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    .green { background: #22c55e; color: #052e16; }
    .amber { background: #f59e0b; color: #271300; }
    .panel { display: none; margin-top: 12px; padding: 12px; border-radius: 10px; background: #0b1020; border: 1px solid #24304b; }
    .cmd { color: #4ade80; font-family: monospace; font-weight: 700; }
    .row-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #0b1020; border: 1px solid #24304b; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Bank <span style="color:#38bdf8">Nezzi</span></h1>
      <div class="muted">Wpłaty w grze na konto: <b>NezziBG</b> • Lokata: <b style="color:#4ade80">+10%</b></div>
    </div>

    <div class="card">
      <h2>Konto i wpłaty</h2>
      <div class="row">
        <input id="nickInput" type="text" placeholder="Twój nick z Minecraft..." style="flex:1; min-width:180px;" />
        <button type="button" class="blue" id="btnGenPay">Generuj /pay</button>
        <button type="button" class="dark" id="btnCheckUser">Sprawdź konto</button>
      </div>

      <div class="panel" id="payPanel"></div>

      <div class="panel" id="userPanel">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div>Gracz <b id="userName"></b> — Saldo: <b id="userBalance" style="color:#4ade80;">0 $</b></div>
          <div class="row" style="margin-top:0;">
            <input id="withdrawInput" type="number" min="1" placeholder="Kwota" style="width:110px;" />
            <button type="button" class="amber" id="btnWithdraw">Wypłać</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Lista wpłacających</h2>
      <div id="depositorsList" class="muted">Brak wpłat.</div>
    </div>

    <div class="card">
      <h2 style="color:#38bdf8;">Panel Admina</h2>
      <div id="adminLogin" class="row">
        <input id="adminPassInput" type="password" placeholder="Hasło administratora" />
        <button type="button" class="blue" id="btnAdminLogin">Odblokuj</button>
      </div>

      <div id="adminContent" style="display:none;">
        <div class="row">
          <button type="button" class="green" id="btnInterest">+10% zysku</button>
          <input id="manualNick" type="text" placeholder="Nick" style="width:150px;" />
          <input id="manualAmount" type="number" min="1" placeholder="Kwota" style="width:110px;" />
          <button type="button" class="blue" id="btnManualDeposit">Dodaj wpłatę</button>
        </div>
        <div id="pendingList"></div>
        <div id="withdrawList"></div>
        <div id="usersList"></div>
      </div>
    </div>
  </div>

  <script>
    let currentNick = "";
    let adminPass = "";

    function text(el, val) {
      el.textContent = val;
    }

    async function postJson(url, payload) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    async function loadState() {
      try {
        const res = await fetch("/api/state");
        if (!res.ok) return;
        const data = await res.json();
        renderAll(data);
      } catch (_) {}
    }

    function renderAll(data) {
      const users = Object.values(data.users || {});
      const depositors = users
        .filter(u => u.totalDeposited > 0)
        .sort((a, b) => b.totalDeposited - a.totalDeposited);

      const listEl = document.getElementById("depositorsList");
      listEl.innerHTML = "";
      if (!depositors.length) {
        listEl.innerHTML = '<div class="muted">Brak wpłat.</div>';
      } else {
        depositors.forEach((u, idx) => {
          const item = document.createElement("div");
          item.className = "row-item";
          item.innerHTML = '<span>#' + (idx + 1) + ' <b></b></span><span style="color:#4ade80;font-weight:700;"></span>';
          item.querySelector("b").textContent = u.nick;
          item.querySelectorAll("span")[1].textContent = "Wpłacono: " + u.totalDeposited + " $ • Saldo: " + u.balance + " $";
          listEl.appendChild(item);
        });
      }

      if (currentNick) {
        const u = (data.users || {})[currentNick.toLowerCase()] || { nick: currentNick, balance: 0 };
        text(document.getElementById("userName"), u.nick);
        text(document.getElementById("userBalance"), u.balance + " $");
      }

      if (adminPass) {
        renderAdmin(data);
      }
    }

    function renderAdmin(data) {
      const pendingEl = document.getElementById("pendingList");
      pendingEl.innerHTML = "";
      Object.entries(data.pending || {}).forEach(([key, p]) => {
        const row = document.createElement("div");
        row.className = "row-item";
        const span = document.createElement("span");
        span.textContent = p.nick + " — " + p.amount + " $";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "green";
        btn.textContent = "Zatwierdź";
        btn.onclick = async () => {
          await postJson("/api/approve", { key, pass: adminPass });
          loadState();
        };
        row.append(span, btn);
        pendingEl.appendChild(row);
      });

      const withdrawEl = document.getElementById("withdrawList");
      withdrawEl.innerHTML = "";
      (data.withdraws || []).filter(w => w.status === "OCZEKUJE").forEach(w => {
        const row = document.createElement("div");
        row.className = "row-item";
        const span = document.createElement("span");
        span.textContent = "/pay " + w.nick + " " + w.amount;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "amber";
        btn.textContent = "Wypłacono";
        btn.onclick = async () => {
          await postJson("/api/done-withdraw", { id: w.id, pass: adminPass });
          loadState();
        };
        row.append(span, btn);
        withdrawEl.appendChild(row);
      });

      const usersEl = document.getElementById("usersList");
      usersEl.innerHTML = "";
      Object.values(data.users || {}).forEach(u => {
        const row = document.createElement("div");
        row.className = "row-item";
        row.textContent = u.nick + " • wpłaty: " + u.totalDeposited + " $ • saldo: " + u.balance + " $";
        usersEl.appendChild(row);
      });
    }

    document.getElementById("btnGenPay").addEventListener("click", async () => {
      const nick = document.getElementById("nickInput").value.trim();
      if (!nick) return alert("Wpisz nick.");
      currentNick = nick;
      const out = await postJson("/api/pending", { nick });
      const panel = document.getElementById("payPanel");
      panel.style.display = "block";
      panel.innerHTML = 'Wyślij w grze: <span class="cmd"></span>';
      panel.querySelector(".cmd").textContent = "/pay NezziBG " + out.amount;
    });

    document.getElementById("btnCheckUser").addEventListener("click", () => {
      const nick = document.getElementById("nickInput").value.trim() || currentNick;
      if (!nick) return alert("Wpisz nick.");
      currentNick = nick;
      document.getElementById("userPanel").style.display = "block";
      loadState();
    });

    document.getElementById("btnWithdraw").addEventListener("click", async () => {
      const amount = Number(document.getElementById("withdrawInput").value);
      if (!currentNick || !amount || amount <= 0) return;
      await postJson("/api/withdraw", { nick: currentNick, amount });
      document.getElementById("withdrawInput").value = "";
      loadState();
    });

    document.getElementById("btnAdminLogin").addEventListener("click", () => {
      const pass = document.getElementById("adminPassInput").value;
      if (pass !== "7532252") return alert("Złe hasło");
      adminPass = pass;
      document.getElementById("adminLogin").style.display = "none";
      document.getElementById("adminContent").style.display = "block";
      loadState();
    });

    document.getElementById("btnInterest").addEventListener("click", async () => {
      await postJson("/api/interest", { pass: adminPass });
      loadState();
    });

    document.getElementById("btnManualDeposit").addEventListener("click", async () => {
      const nick = document.getElementById("manualNick").value.trim();
      const amount = Number(document.getElementById("manualAmount").value);
      if (!nick || !amount || amount <= 0) return;
      await postJson("/api/deposit", { nick, amount, pass: adminPass });
      document.getElementById("manualNick").value = "";
      document.getElementById("manualAmount").value = "";
      loadState();
    });

    loadState();
    setInterval(loadState, 3000);
  </script>
</body>
</html>

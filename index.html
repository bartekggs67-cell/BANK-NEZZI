<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Nezzi</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #0c1222; color: #f8fafc; padding: 16px; }
    .box { max-width: 860px; margin: 0 auto; }
    .card { background: #151e35; border: 1px solid #29385c; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    h1, h2, h3 { margin: 0 0 8px 0; }
    .muted { color: #94a3b8; font-size: 13px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
    input { background: #090e1a; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .b-blue { background: #38bdf8; color: #082f49; }
    .b-green { background: #22c55e; color: #052e16; }
    .b-dark { background: #1e293b; color: #fff; border: 1px solid #334155; }
    .b-amber { background: #f59e0b; color: #271300; }
    .b-red { background: #ef4444; color: #fff; }
    .sec { display: none; }
    .sec.show { display: block; }
    .item { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; background: #090e1a; border: 1px solid #243252; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 13px; }
    .status { margin-top: 10px; font-size: 13px; font-weight: 700; color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
<div class="box">
  <div class="card">
    <h1>Bank <span style="color:#38bdf8">Nezzi</span></h1>
    <div class="muted">Wpłaty w grze: <b>NezziBG</b> • Lokata: <b style="color:#4ade80">+10%</b></div>
    <div class="row">
      <button type="button" class="b-blue" onclick="openTab('konto')">Moje konto</button>
      <button type="button" class="b-dark" onclick="openTab('topki')">Topki</button>
      <button type="button" class="b-dark" onclick="openTab('admin')">Panel Admina</button>
    </div>
  </div>

  <!-- ZAKŁADKA KONTO -->
  <div id="tab-konto" class="sec show">
    <div class="card" id="loginCard">
      <h2>Logowanie / Rejestracja</h2>
      <div class="row">
        <input id="uNick" type="text" placeholder="Nick z Minecraft..." />
        <input id="uPass" type="password" placeholder="Hasło (min. 4 znaki)" />
      </div>
      <div class="row">
        <button type="button" class="b-blue" onclick="auth('login')">Zaloguj</button>
        <button type="button" class="b-green" onclick="auth('register')">Zarejestruj się</button>
      </div>
      <div id="authStatus" class="status"></div>
    </div>

    <div class="card sec" id="userCard">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <h2>Gracz: <span id="meNick" style="color:#38bdf8"></span></h2>
        <button type="button" class="b-dark" onclick="logout()">Wyloguj</button>
      </div>
      <div class="item"><span>Wpłacono łącznie:</span><b id="meDep" style="color:#38bdf8">0 $</b></div>
      <div class="item"><span>Do odebrania (saldo):</span><b id="meBal" style="color:#4ade80">0 $</b></div>

      <div class="row">
        <input id="payAmt" type="number" min="1" placeholder="Kwota wpłaty ($)" style="width:160px" />
        <button type="button" class="b-blue" onclick="makePay()">Generuj /pay</button>
      </div>
      <div id="payOut" class="status"></div>

      <div class="row">
        <input id="wdAmt" type="number" min="1" placeholder="Kwota wypłaty ($)" style="width:160px" />
        <button type="button" class="b-amber" onclick="makeWd()">Wypłać</button>
      </div>
      <div id="wdOut" class="status"></div>
    </div>

    <div class="card">
      <h2>Lista wpłacających</h2>
      <div id="depList" class="muted">Brak wpłat.</div>
    </div>
  </div>

  <!-- ZAKŁADKA TOPKI -->
  <div id="tab-topki" class="sec">
    <div class="card">
      <h2>Top saldo</h2>
      <div id="topBal" class="muted">Brak danych.</div>
    </div>
    <div class="card">
      <h2>Top wpłaty</h2>
      <div id="topDep" class="muted">Brak danych.</div>
    </div>
  </div>

  <!-- ZAKŁADKA ADMIN -->
  <div id="tab-admin" class="sec">
    <div class="card">
      <h2 style="color:#38bdf8">Panel Admina</h2>
      <div id="admLogin" class="row">
        <input id="admPass" type="password" placeholder="Hasło admina" />
        <button type="button" class="b-blue" onclick="admUnlock()">Odblokuj</button>
      </div>
      <div id="admPanel" class="sec">
        <div class="row">
          <button type="button" class="b-green" onclick="admAction('/api/interest', {})">+10% wszystkim</button>
        </div>
        <div class="row">
          <input id="eNick" type="text" placeholder="Nick" style="width:130px" />
          <input id="eBal" type="number" placeholder="Saldo" style="width:100px" />
          <input id="eDep" type="number" placeholder="Wpłaty" style="width:100px" />
          <button type="button" class="b-blue" onclick="saveUser()">Dodaj / Edytuj</button>
        </div>
        <div class="row">
          <input id="sNick" type="text" placeholder="Nick" style="width:130px" />
          <input id="sAmt" type="number" placeholder="Kwota" style="width:100px" />
          <button type="button" class="b-dark" onclick="simSend(false)">Symuluj oczekującą</button>
          <button type="button" class="b-green" onclick="simSend(true)">Symuluj i zaksięguj</button>
        </div>
        <h3>Oczekujące wpłaty</h3>
        <div id="admPend"></div>
        <h3>Wypłaty</h3>
        <div id="admWd"></div>
        <h3>Gracze</h3>
        <div id="admUsers"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="muted">Podgląd działania: <span id="dbg" style="color:#38bdf8">Gotowe</span></div>
  </div>
</div>

<script>
let me = null;
let adm = "";
let dbState = { users: {}, pending: {}, withdraws: [] };

function dbg(t) {
  document.getElementById("dbg").textContent = t;
}

function openTab(name) {
  dbg("Kliknięto zakładkę: " + name);
  document.getElementById("tab-konto").classList.toggle("show", name === "konto");
  document.getElementById("tab-topki").classList.toggle("show", name === "topki");
  document.getElementById("tab-admin").classList.toggle("show", name === "admin");
  render();
}

async function callApi(url, body) {
  try {
    const opts = body ? {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    } : { method: "GET" };
    const r = await fetch(url, opts);
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok && j.ok !== false, data: j };
  } catch (e) {
    return { ok: false, data: { error: "Błąd sieci: " + e.message } };
  }
}

async function sync() {
  const res = await callApi("/api/state");
  if (res.ok && res.data && res.data.users) {
    dbState = res.data;
    render();
  }
}

function render() {
  const users = Object.values(dbState.users || {});

  document.getElementById("loginCard").classList.toggle("show", !me);
  document.getElementById("userCard").classList.toggle("show", Boolean(me));
  if (me) {
    const u = (dbState.users || {})[me.nick.toLowerCase()] || { nick: me.nick, balance: 0, totalDeposited: 0 };
    document.getElementById("meNick").textContent = u.nick;
    document.getElementById("meDep").textContent = (u.totalDeposited || 0) + " $";
    document.getElementById("meBal").textContent = (u.balance || 0) + " $";
  }

  const depUsers = users.filter(u => (u.totalDeposited || 0) > 0).sort((a, b) => b.totalDeposited - a.totalDeposited);
  document.getElementById("depList").innerHTML = depUsers.length
    ? depUsers.map((u, i) => '<div class="item"><span>#' + (i + 1) + ' <b>' + u.nick + '</b></span><b style="color:#4ade80">Wpłacono: ' + u.totalDeposited + ' $ • Saldo: ' + u.balance + ' $</b></div>').join("")
    : '<div class="muted">Brak wpłat.</div>';

  const byBal = [...users].sort((a, b) => (b.balance || 0) - (a.balance || 0));
  const byDep = [...users].sort((a, b) => (b.totalDeposited || 0) - (a.totalDeposited || 0));
  document.getElementById("topBal").innerHTML = byBal.length
    ? byBal.map((u, i) => '<div class="item"><span>#' + (i + 1) + ' <b>' + u.nick + '</b></span><b style="color:#4ade80">' + (u.balance || 0) + ' $</b></div>').join("")
    : '<div class="muted">Brak danych.</div>';
  document.getElementById("topDep").innerHTML = byDep.length
    ? byDep.map((u, i) => '<div class="item"><span>#' + (i + 1) + ' <b>' + u.nick + '</b></span><b style="color:#38bdf8">' + (u.totalDeposited || 0) + ' $</b></div>').join("")
    : '<div class="muted">Brak danych.</div>';

  if (adm) {
    document.getElementById("admPanel").classList.add("show");
    document.getElementById("admPend").innerHTML = Object.entries(dbState.pending || {}).map(([k, p]) =>
      '<div class="item"><span><b>' + p.nick + '</b> — ' + p.amount + ' $</span><button type="button" class="b-green" onclick="admAction(\\x27/api/approve\\x27,{key:\\x27' + k + '\\x27})">Zatwierdź</button></div>'
    ).join("") || '<div class="muted">Brak.</div>';

    document.getElementById("admWd").innerHTML = (dbState.withdraws || []).filter(w => w.status === "OCZEKUJE").map(w =>
      '<div class="item"><span>/pay ' + w.nick + ' ' + w.amount + '</span><button type="button" class="b-amber" onclick="admAction(\\x27/api/done-withdraw\\x27,{id:' + w.id + '})">Wypłacono</button></div>'
    ).join("") || '<div class="muted">Brak.</div>';

    document.getElementById("admUsers").innerHTML = Object.entries(dbState.users || {}).map(([k, u]) =>
      '<div class="item"><span><b>' + u.nick + '</b> • wpłaty: ' + (u.totalDeposited || 0) + ' $ • saldo: ' + (u.balance || 0) + ' $</span><span><button type="button" class="b-blue" onclick="fillEdit(\\x27' + u.nick + '\\x27,' + (u.balance || 0) + ',' + (u.totalDeposited || 0) + ')">Edytuj</button> <button type="button" class="b-red" onclick="admAction(\\x27/api/delete-user\\x27,{key:\\x27' + k + '\\x27})">Usuń</button></span></div>'
    ).join("") || '<div class="muted">Brak.</div>';
  }
}

async function auth(mode) {
  dbg("Kliknięto: " + mode);
  const nick = document.getElementById("uNick").value.trim();
  const password = document.getElementById("uPass").value;
  const st = document.getElementById("authStatus");
  if (!nick || !password) {
    st.className = "status err";
    st.textContent = "Wpisz nick i hasło.";
    return;
  }
  const r = await callApi("/api/auth", { nick, password, mode });
  if (!r.ok || !r.data.user) {
    st.className = "status err";
    st.textContent = r.data.error || "Błąd logowania.";
    return;
  }
  me = { nick: r.data.user.nick, password };
  st.textContent = "";
  await sync();
}

function logout() {
  me = null;
  document.getElementById("uPass").value = "";
  render();
}

async function makePay() {
  if (!me) return;
  const amount = Math.floor(Number(document.getElementById("payAmt").value) || 0);
  const out = document.getElementById("payOut");
  if (amount <= 0) {
    out.className = "status err";
    out.textContent = "Wpisz kwotę większą od 0.";
    return;
  }
  const r = await callApi("/api/pending", { nick: me.nick, amount });
  if (!r.ok) {
    out.className = "status err";
    out.textContent = r.data.error || "Błąd.";
    return;
  }
  out.className = "status";
  out.textContent = "Wyślij w grze: /pay NezziBG " + r.data.amount;
  await sync();
}

async function makeWd() {
  if (!me) return;
  const amount = Math.floor(Number(document.getElementById("wdAmt").value) || 0);
  const out = document.getElementById("wdOut");
  const r = await callApi("/api/withdraw", { nick: me.nick, password: me.password, amount });
  if (!r.ok) {
    out.className = "status err";
    out.textContent = r.data.error || "Za mało salda.";
    return;
  }
  out.className = "status";
  out.textContent = "Wysłano wypłatę " + amount + " $.";
  document.getElementById("wdAmt").value = "";
  await sync();
}

function admUnlock() {
  const p = document.getElementById("admPass").value;
  if (p !== "7532252") return alert("Złe hasło");
  adm = p;
  document.getElementById("admLogin").style.display = "none";
  render();
}

async function admAction(url, body) {
  await callApi(url, { ...body, pass: adm });
  await sync();
}

function fillEdit(nick, bal, dep) {
  document.getElementById("eNick").value = nick;
  document.getElementById("eBal").value = bal;
  document.getElementById("eDep").value = dep;
}

async function saveUser() {
  await admAction("/api/save-user", {
    nick: document.getElementById("eNick").value.trim(),
    balance: Number(document.getElementById("eBal").value || 0),
    totalDeposited: Number(document.getElementById("eDep").value || 0)
  });
}

async function simSend(instant) {
  await admAction("/api/simulate-send", {
    nick: document.getElementById("sNick").value.trim(),
    amount: Number(document.getElementById("sAmt").value || 0),
    instant
  });
}

sync();
setInterval(sync, 3000);
</script>
</body>
</html>
